version: '3.9'

services:
  # --- PostgreSQL with TimescaleDB ---
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: dsp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dsp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dsp_password}
      POSTGRES_DB: ${POSTGRES_DB:-dsp_investment}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsp_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dsp-network

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: dsp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-dsp_redis_pass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dsp_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dsp-network

  # --- Qdrant Vector Database ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dsp-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - dsp-network

  # --- Backend API ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsp-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - dsp-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dsp-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - dsp-network
    command: npm run dev -- --host

  # --- MLflow Tracking Server ---
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: dsp-mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-dsp_user}:${POSTGRES_PASSWORD:-dsp_password}@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsp-network
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-dsp_user}:${POSTGRES_PASSWORD:-dsp_password}@postgres:5432/mlflow
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  mlflow_data:

networks:
  dsp-network:
    driver: bridge
